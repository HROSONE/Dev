name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create .env
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || printf 'GEMINI_API_KEY=MY_GEMINI_API_KEY\n' > .env
          fi

      - name: Debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Fetch llama.cpp Android arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLAMA_TAG: b9782
        run: |
          chmod +x scripts/fetch-llama-android.sh
          ./scripts/fetch-llama-android.sh

      - name: Assemble debug APK
        run: |
          CODE=${{ github.run_number }}
          NAME="1.1.${CODE}"
          gradle assembleDebug \
            -PversionCode=$CODE \
            -PversionName=$NAME \
            --no-configuration-cache \
            --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK não encontrado"
            exit 1
          fi
          cp "$APK" "dist/DevAgent-1.1.${{ github.run_number }}.apk"
          ls -la dist/
          # Confirma que o motor foi empacotado
          unzip -l "dist/DevAgent-1.1.${{ github.run_number }}.apk" | grep -E 'libllama_server|arm64-v8a' || echo "AVISO: libllama_server não listado no APK"

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: DevAgent 1.1.${{ github.run_number }}
          body: |
            Build automático · `${{ github.sha }}`

            - versionCode=${{ github.run_number }}
            - versionName=1.1.${{ github.run_number }}
            - motor local: llama.cpp android-arm64 (libllama_server.so)

            Baixe **DevAgent-1.1.${{ github.run_number }}.apk** e instale no celular
            (permita instalar apps desta fonte se o Android pedir).
          files: dist/DevAgent-1.1.${{ github.run_number }}.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
