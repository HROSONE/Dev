name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create .env
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || true
            if [ ! -f .env ]; then
              printf 'GEMINI_API_KEY=MY_GEMINI_API_KEY\n' > .env
            fi
          fi

      - name: Debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Assemble debug APK
        run: |
          CODE=${{ github.run_number }}
          NAME="1.1.${CODE}"
          gradle assembleDebug \
            -PversionCode=$CODE \
            -PversionName=$NAME \
            --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevAgent-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: DevAgent 1.1.${{ github.run_number }}
          body: |
            Build automático · `${{ github.sha }}`

            - versionCode=${{ github.run_number }}
            - versionName=1.1.${{ github.run_number }}

            Baixe o APK e instale (permita fontes desconhecidas para este app).
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
