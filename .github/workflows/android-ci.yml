name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create .env
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || printf 'GEMINI_API_KEY=MY_GEMINI_API_KEY\n' > .env
          fi

      - name: Debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Unit tests are a required gate: failures must fail the workflow.
      - name: Unit tests
        run: gradle --no-configuration-cache testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle --no-configuration-cache assembleDebug --stacktrace
