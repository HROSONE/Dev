name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create .env
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
          fi

      - name: Debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1
            chmod +x gradlew
          fi

      - name: Build debug APK
        run: |
          CODE=${{ github.run_number }}
          NAME="1.1.${CODE}"
          ./gradlew assembleDebug \
            -PversionCode=$CODE \
            -PversionName=$NAME \
            --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevAgent-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Version meta
        id: ver
        run: |
          CODE=${{ github.run_number }}
          NAME="1.1.${CODE}"
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "tag=v${NAME}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: DevAgent ${{ steps.ver.outputs.name }}
          body: |
            Build automático · commit `${{ github.sha }}`

            - versionCode=${{ steps.ver.outputs.code }}
            - versionName=${{ steps.ver.outputs.name }}

            Baixe o APK abaixo. No celular, permita instalar apps desta fonte se pedido.
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
